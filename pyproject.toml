[project]
name = "connections-solver"
version = "0.1.0"
description = "Backend service for solving NYT Connections puzzles using AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "sqlalchemy==2.0.25",
    "httpx>=0.26.0",
    "numpy>=1.24.0,<2.0.0",
    "gensim>=4.3.0,<5.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "scipy>=1.11.1,<2.0.0",  # Avoid yanked 1.11.0 release
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/connections_solver"]

[dependency-groups]
dev = [
    "black==24.1.1",
    "ruff==0.1.14",
    "pylint==3.0.3",
    "flake8==7.0.0",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "matplotlib>=3.7.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
